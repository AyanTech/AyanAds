ayanNetworking = { module = "com.github.shadowalker77:networking", version.ref = "ayanNetworking" }
hamrahAds = { module = "com.github.AyanTech:HamrahAds", version.ref = "hamrahAds" }
ayanNetworkGenerator = { module = "com.github.shadowalker77:generator", version.ref = "generator" }

play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
user-messaging-platform = { module = "com.google.android.ump:user-messaging-platform", version.ref = "userMessagingPlatform" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }

